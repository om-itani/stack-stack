[package]
name = "stack-stack"
version = "0.1.0"
edition = "2024"
description = "stack-stack — a single-binary homelab control plane (metrics, containers, router, virtualization, services)"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
# Docker daemon client. Only the Unix-socket / named-pipe transports are needed
# (`pipe`); the default `http`/TLS surface is switched off so no TLS stack is
# pulled into a binary that only ever talks to the local socket.
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
futures-util = "0.3.34"
libc = "0.2.191"
mime_guess = "2.0.5"
rust-embed = { version = "8.13.0", features = ["axum", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
