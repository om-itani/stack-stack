[package]
name = "stack-stack"
version = "0.1.0"
edition = "2024"
description = "stack-stack — a single-binary homelab control plane (metrics, containers, router, virtualization, services)"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
libc = "0.2.191"
mime_guess = "2.0.5"
rust-embed = { version = "8.13.0", features = ["axum", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
